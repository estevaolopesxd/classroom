services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: classroom
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Classroom@2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-Minio@2024}
      # CORS nativo do MinIO — aceita qualquer origem para upload direto do browser
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Minio@2024}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/videos &&
        mc mb --ignore-existing local/thumbnails &&
        mc mb --ignore-existing local/avatars &&
        mc mb --ignore-existing local/logos &&
        mc anonymous set download local/videos &&
        mc anonymous set download local/thumbnails &&
        mc anonymous set download local/avatars &&
        mc anonymous set download local/logos &&
        echo 'MinIO buckets OK'
      "
    restart: on-failure

  nginx-rtmp:
    build:
      context: ./nginx-rtmp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8090:80"
    volumes:
      - hls_tmp:/tmp/hls

  api:
    build:
      context: ./backend
      dockerfile: src/Classroom.API/Dockerfile
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=classroom;Username=classroom;Password=${POSTGRES_PASSWORD:-Classroom@2024}"
      Jwt__Secret: ${JWT_SECRET:-aB3kP9mX2nQ7rY5wZ1cD8fG4hJ6iK0lL3mN5oP7qR9sT1uV3wX5yZ7aB9cD1eF3g}
      Jwt__Issuer: classroom-api
      Jwt__Audience: classroom-app
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "30"
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      MinIO__SecretKey: ${MINIO_SECRET_KEY:-Minio@2024}
      MinIO__BucketVideos: videos
      MinIO__BucketThumbnails: thumbnails
      MinIO__BucketAvatars: avatars
      MinIO__BucketLogos: logos
      MinIO__PublicEndpoint: http://${SERVER_IP:-localhost}:9000
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-sk_test_disabled}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-whsec_disabled}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-pk_test_disabled}
      NginxRtmp__RtmpUrl: rtmp://nginx-rtmp:1935/live
      NginxRtmp__HlsBaseUrl: http://${SERVER_IP:-localhost}:8090/hls
      NginxRtmp__CallbackSecret: ${RTMP_CALLBACK_SECRET:-mude-este-secret-em-producao}
      Redis__ConnectionString: redis:6379
      # CORS: origens permitidas em produção (frontend URL)
      AllowedOrigins__0: http://${SERVER_IP:-localhost}:3002
      AllowedOrigins__1: http://localhost:3002
      AllowedOrigins__2: http://localhost:3000
      Admin__DefaultEmail: ${ADMIN_EMAIL:-admin@classroom.com}
      Admin__DefaultPassword: ${ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "8080:8080"
    volumes:
      - hls_tmp:/tmp/hls
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP:-localhost}:8080
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://${SERVER_IP:-localhost}:8080
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_disabled}
      NEXT_PUBLIC_HLS_BASE_URL: http://${SERVER_IP:-localhost}:8090/hls
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hls_tmp:
