###############################################################################
# Classroom — Docker Compose
#
# Serviços da aplicação:  postgres, redis, minio, minio-init,
#                         nginx-rtmp, api, frontend
#
# Stack Supabase self-hosted:  supabase-db, supabase-studio, supabase-kong,
#                              supabase-auth, supabase-rest, supabase-realtime,
#                              supabase-meta, supabase-storage, imgproxy
#
# Portas expostas:
#   3002  → Frontend (Next.js)
#   8080  → API (ASP.NET Core)
#   9000  → MinIO API
#   9001  → MinIO Console
#   1935  → RTMP (live stream)
#   8090  → HLS (live stream)
#   3001  → Supabase Studio  ← painel visual do banco
#   8000  → Supabase Kong    ← gateway da API Supabase
#   5433  → Supabase DB      ← acesso direto ao PostgreSQL Supabase
###############################################################################

services:

  ##############################################################################
  # APLICAÇÃO CLASSROOM
  ##############################################################################

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: classroom
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Classroom@2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-Minio@2024}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Minio@2024}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/videos &&
        mc mb --ignore-existing local/thumbnails &&
        mc mb --ignore-existing local/avatars &&
        mc mb --ignore-existing local/logos &&
        mc anonymous set download local/videos &&
        mc anonymous set download local/thumbnails &&
        mc anonymous set download local/avatars &&
        mc anonymous set download local/logos &&
        echo 'MinIO buckets OK'
      "
    restart: on-failure

  nginx-rtmp:
    build:
      context: ./nginx-rtmp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8090:80"
    volumes:
      - hls_tmp:/tmp/hls

  api:
    build:
      context: ./backend
      dockerfile: src/Classroom.API/Dockerfile
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=classroom;Username=classroom;Password=${POSTGRES_PASSWORD:-Classroom@2024}"
      Jwt__Secret: ${JWT_SECRET:-aB3kP9mX2nQ7rY5wZ1cD8fG4hJ6iK0lL3mN5oP7qR9sT1uV3wX5yZ7aB9cD1eF3g}
      Jwt__Issuer: classroom-api
      Jwt__Audience: classroom-app
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "30"
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      MinIO__SecretKey: ${MINIO_SECRET_KEY:-Minio@2024}
      MinIO__BucketVideos: videos
      MinIO__BucketThumbnails: thumbnails
      MinIO__BucketAvatars: avatars
      MinIO__BucketLogos: logos
      MinIO__PublicEndpoint: http://${SERVER_IP:-localhost}:9000
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-sk_test_disabled}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-whsec_disabled}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-pk_test_disabled}
      NginxRtmp__RtmpUrl: rtmp://nginx-rtmp:1935/live
      NginxRtmp__HlsBaseUrl: http://${SERVER_IP:-localhost}:8090/hls
      NginxRtmp__CallbackSecret: ${RTMP_CALLBACK_SECRET:-mude-este-secret-em-producao}
      Redis__ConnectionString: redis:6379
      AllowedOrigins__0: http://${SERVER_IP:-localhost}:3002
      AllowedOrigins__1: http://localhost:3002
      AllowedOrigins__2: http://localhost:3000
      Admin__DefaultEmail: ${ADMIN_EMAIL:-admin@classroom.com}
      Admin__DefaultPassword: ${ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "8080:8080"
    volumes:
      - hls_tmp:/tmp/hls
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP:-localhost}:8080
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://${SERVER_IP:-localhost}:8080
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_disabled}
      NEXT_PUBLIC_HLS_BASE_URL: http://${SERVER_IP:-localhost}:8090/hls
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy

  ##############################################################################
  # SUPABASE SELF-HOSTED
  # Studio:  http://SERVER_IP:3001
  # API:     http://SERVER_IP:8000  (use ANON_KEY ou SERVICE_ROLE_KEY)
  # DB:      postgres://postgres:SUPABASE_DB_PASSWORD@SERVER_IP:5433/postgres
  ##############################################################################

  # PostgreSQL dedicado ao Supabase (separado do banco da aplicação)
  supabase-db:
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-Supabase@2024}
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET:-seu-super-secreto-jwt-com-pelo-menos-32-caracteres-aqui!!}
      JWT_EXP: 3600
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # API Gateway — roteia /auth, /rest, /storage, /realtime
  supabase-kong:
    image: kong:2.8.1
    restart: unless-stopped
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./supabase/volumes/api/kong.yml:/home/kong/temp.yml:ro
    ports:
      - "8000:8000"    # HTTP
      - "8443:8443"    # HTTPS (opcional)
    depends_on:
      supabase-db:
        condition: service_healthy

  # GoTrue — autenticação (email/senha, OAuth, magic link)
  supabase-auth:
    image: supabase/gotrue:v2.151.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_API_EXTERNAL_URL:-http://localhost:8000}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${SUPABASE_DB_PASSWORD:-Supabase@2024}@supabase-db:5432/postgres?search_path=auth"

      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-http://localhost:3001}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-seu-super-secreto-jwt-com-pelo-menos-32-caracteres-aqui!!}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"   # desabilite em produção e configure SMTP

      # SMTP (opcional) — configure no .env para enviar emails reais
      GOTRUE_SMTP_HOST: ${SUPABASE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SUPABASE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SUPABASE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SUPABASE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SUPABASE_SMTP_ADMIN_EMAIL:-noreply@example.com}
      GOTRUE_MAILER_URLPATHS_INVITE: "%(API_EXTERNAL_URL)s/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "%(API_EXTERNAL_URL)s/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "%(API_EXTERNAL_URL)s/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "%(API_EXTERNAL_URL)s/auth/v1/verify"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgREST — API REST automática a partir do schema do banco
  supabase-rest:
    image: postgrest/postgrest:v12.0.1
    restart: unless-stopped
    environment:
      PGRST_DB_URI: "postgres://authenticator:${SUPABASE_DB_PASSWORD:-Supabase@2024}@supabase-db:5432/postgres"
      PGRST_DB_SCHEMAS: "public,storage,graphql_public"
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-seu-super-secreto-jwt-com-pelo-menos-32-caracteres-aqui!!}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET:-seu-super-secreto-jwt-com-pelo-menos-32-caracteres-aqui!!}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      supabase-db:
        condition: service_healthy
    command: "postgrest"

  # Realtime — WebSockets sobre PostgreSQL LISTEN/NOTIFY
  supabase-realtime:
    image: supabase/realtime:v2.27.5
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-Supabase@2024}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET:-seu-super-secreto-jwt-com-pelo-menos-32-caracteres-aqui!!}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--max-time", "5", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:4000/"]
      interval: 10s
      timeout: 10s
      retries: 5

  # pg-meta — introspection do banco, usado pelo Studio (Table Editor)
  supabase-meta:
    image: supabase/postgres-meta:v0.80.0
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-Supabase@2024}
    depends_on:
      supabase-db:
        condition: service_healthy

  # Storage API — gerenciamento de arquivos via Supabase
  supabase-storage:
    image: supabase/storage-api:v1.0.6
    restart: unless-stopped
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-seu-super-secreto-jwt-com-pelo-menos-32-caracteres-aqui!!}
      DATABASE_URL: "postgres://supabase_storage_admin:${SUPABASE_DB_PASSWORD:-Supabase@2024}@supabase-db:5432/postgres"
      FILE_SIZE_LIMIT: 52428800   # 50MB
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - supabase_storage_data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # imgproxy — redimensionamento de imagens on-the-fly para o Storage
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - supabase_storage_data:/var/lib/storage:ro

  # Supabase Studio — painel visual do banco (http://SERVER_IP:3001)
  supabase-studio:
    image: supabase/studio:20240422-5cf8f30
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-Supabase@2024}
      DEFAULT_ORGANIZATION_NAME: "Classroom"
      DEFAULT_PROJECT_NAME: "classroom-db"
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: http://${SERVER_IP:-localhost}:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET:-seu-super-secreto-jwt-com-pelo-menos-32-caracteres-aqui!!}
      LOGFLARE_API_KEY: ""
      LOGFLARE_URL: ""
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    ports:
      - "3001:3000"
    depends_on:
      supabase-kong:
        condition: service_started
      supabase-meta:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/profile').then(r => { if (r.status !== 200) process.exit(1) })"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  # Aplicação
  postgres_data:
  redis_data:
  minio_data:
  hls_tmp:
  # Supabase
  supabase_db_data:
  supabase_storage_data:
