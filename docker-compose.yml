version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: classroom
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
        mc mb --ignore-existing local/videos;
        mc mb --ignore-existing local/thumbnails;
        mc mb --ignore-existing local/avatars;
        mc mb --ignore-existing local/logos;
        mc anonymous set download local/thumbnails;
        mc anonymous set download local/avatars;
        mc anonymous set download local/logos;
        echo 'MinIO buckets initialized successfully';
      "
    restart: on-failure

  nginx-rtmp:
    build:
      context: ./nginx-rtmp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8090:80"
    volumes:
      - hls_tmp:/tmp/hls
    environment:
      API_URL: http://api:8080

  api:
    build:
      context: ./backend
      dockerfile: src/Classroom.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=classroom;Username=classroom;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: classroom-api
      Jwt__Audience: classroom-app
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "30"
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ACCESS_KEY}
      MinIO__SecretKey: ${MINIO_SECRET_KEY}
      MinIO__BucketVideos: videos
      MinIO__BucketThumbnails: thumbnails
      MinIO__BucketAvatars: avatars
      MinIO__BucketLogos: logos
      MinIO__PublicEndpoint: http://localhost:9000
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      NginxRtmp__RtmpUrl: rtmp://nginx-rtmp:1935/live
      NginxRtmp__HlsBaseUrl: http://localhost:8090/hls
      Redis__ConnectionString: redis:6379
      Cors__Origins: ${FRONTEND_URL}
      Admin__DefaultEmail: ${ADMIN_EMAIL}
      Admin__DefaultPassword: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - hls_tmp:/tmp/hls
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_HLS_BASE_URL: ${NEXT_PUBLIC_HLS_BASE_URL:-http://localhost:8090/hls}
    ports:
      - "3002:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hls_tmp:
