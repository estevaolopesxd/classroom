worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_message 5M;

        application live {
            live on;
            record off;

            # HLS output
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            hls_nested on;

            allow publish all;
            allow play all;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Use Docker internal DNS so hostnames resolve at request time
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Serve HLS segments
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
        }

        # Health check
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Proxy para validação de stream key (resolvido em runtime)
        location /rtmp-auth {
            internal;
            set $api_host "api:8080";
            proxy_pass http://$api_host/api/streams/rtmp/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
    }
}
